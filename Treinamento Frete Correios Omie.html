<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Treinamento Frete Correios Omie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Conceito: apresentação de treinamento em tela cheia. Cabeçalho fixo com a logo NCS, palco central
   (slides e passos com telas do Omie e marcações), rodapé fixo com navegação e roteiro do apresentador.
   Paleta tirada da logo: ciano, azul e azul-petróleo. Marcação nas telas em azul com halo (contrasta com o laranja do Omie). */
:root{
  --bg:#EDF4F8; --surface:#FFFFFF; --surface-2:#E1F0F6; --ink:#0E2431; --ink-2:#47606E; --line:#CDDFE8;
  --brand:#0089C3; --brand-2:#12BFDA; --deep:#06567F; --on-brand:#FFFFFF;
  --ring:#0089C3; --ring-glow:rgba(0,137,195,.32); --stop:#C2352B; --stop-glow:rgba(194,53,43,.28);
  --ok:#17804F; --ok-bg:#DDF2E8; --bad-bg:#FBE4E1; --tip-bg:#E6F4FA;
  --f-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08171F; --surface:#0F2733; --surface-2:#153646; --ink:#E8F3F8; --ink-2:#9FBAC7; --line:#214456;
  --brand:#3DB8EA; --brand-2:#31D0E8; --deep:#8ED6F2; --on-brand:#06202D;
  --ring:#3DC2F2; --ring-glow:rgba(61,194,242,.38); --stop:#FF7A6E; --stop-glow:rgba(255,122,110,.3);
  --ok:#5FD39A; --ok-bg:#12382A; --bad-bg:#3E1B18; --tip-bg:#12384A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08171F; --surface:#0F2733; --surface-2:#153646; --ink:#E8F3F8; --ink-2:#9FBAC7; --line:#214456;
  --brand:#3DB8EA; --brand-2:#31D0E8; --deep:#8ED6F2; --on-brand:#06202D;
  --ring:#3DC2F2; --ring-glow:rgba(61,194,242,.38); --stop:#FF7A6E; --stop-glow:rgba(255,122,110,.3);
  --ok:#5FD39A; --ok-bg:#12382A; --bad-bg:#3E1B18; --tip-bg:#12384A; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;display:flex;flex-direction:column;min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:56px;padding-block:6px}
.logo-pill{background:#fff;border-radius:10px;padding:3px 8px;display:flex;align-items:center;border:1px solid var(--line)}
.logo-pill img{height:34px;width:auto;display:block}
.top-title{font-family:var(--f-display);font-weight:600;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);font-size:.95rem;white-space:nowrap}

/* palco */
main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding-block:22px 26px}
.slide{display:flex;flex-direction:column;gap:18px;animation:in .28s ease both}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-size:1rem}
.h-xl{font-size:clamp(2.6rem,6.2vw,5rem);text-transform:uppercase}
.h-lg{font-size:clamp(2rem,3.8vw,3rem)}
.lead{font-size:1.15rem;color:var(--ink-2);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--deep);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem}
.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:10px;padding:11px 20px;font-weight:600;font-size:1rem}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:hover:not([disabled]){filter:brightness(1.08)}

/* capa */
.cover{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center;min-height:calc(100dvh - 190px)}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cover .by{color:var(--ink-2);font-size:1rem}
.brand-panel{border-radius:22px;padding:clamp(22px,4vw,48px);background:linear-gradient(155deg,#12BFDA 0%,#0089C3 55%,#06567F 100%);display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;aspect-ratio:1/1;max-height:520px;width:100%;justify-self:center}
.brand-panel .tile{background:#fff;border-radius:18px;padding:18px 22px;width:min(100%,380px);box-shadow:0 10px 30px rgba(3,40,60,.28)}
.brand-panel .tile img{width:100%;height:auto;display:block}
.brand-panel .tag{font-family:var(--f-display);font-weight:600;color:#fff;font-size:1.25rem;letter-spacing:.14em;text-transform:uppercase;text-align:center}

/* roteiro / agenda */
.agenda{display:grid;gap:12px}
.ag{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ag:hover{border-color:var(--brand)}
.ag .n{font-family:var(--f-display);font-weight:700;font-size:2.4rem;color:var(--brand);line-height:1}
.ag b{font-family:var(--f-display);font-size:1.5rem;font-weight:700;display:block;line-height:1.1}
.ag span.d{color:var(--ink-2);font-size:.98rem}
.ag .min{font-variant-numeric:tabular-nums;font-weight:600;color:var(--deep);background:var(--surface-2);border-radius:999px;padding:3px 12px;white-space:nowrap}

/* fluxo */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.node{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.node .who{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.node h3{font-size:1.45rem}
.node .ix{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:1.1rem}
.node[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring-glow)}
.node.focus{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.node.focus .who,.node.focus .ix{color:var(--on-brand);opacity:.9}
.node.focus[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ring-glow)}
.flow-detail{min-height:96px}
.flow-detail h3{font-size:1.6rem;margin-bottom:6px}

/* premissas */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.two h3{font-size:1.7rem;margin-bottom:10px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ticks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.ticks li::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--brand);margin-top:7px}
.ticks.you li::before{background:var(--brand-2);border-radius:50%}
.callout{background:var(--tip-bg);border-radius:12px;padding:14px 18px;border-left:5px solid var(--brand)}
.callout.warn{border-left-color:var(--stop)}

/* passo a passo */
.walk{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:24px;align-items:start}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:center;align-items:flex-start;min-height:200px}
.shot-wrap{position:relative;display:inline-block;max-width:100%}
.shot-wrap img{display:block;max-width:100%;width:auto;height:auto;max-height:calc(100dvh - 270px);min-height:120px;border-radius:6px;border:1px solid var(--line)}
.hs{position:absolute;border:3px solid var(--ring);border-radius:9px;box-shadow:0 0 0 3px #fff,0 0 0 8px var(--ring-glow);animation:pulse 1.9s ease-in-out infinite;pointer-events:none}
.hs.stop{border-color:var(--stop);border-style:dashed;box-shadow:0 0 0 3px #fff,0 0 0 8px var(--stop-glow);animation:none}
.hs i{position:absolute;left:-3px;bottom:calc(100% + 9px);background:var(--ring);color:#fff;font-style:normal;font-weight:600;font-size:.78rem;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hs.r i{left:auto;right:-3px}
.hs.low i{bottom:auto;top:calc(100% + 9px)}
.hs.stop i{background:var(--stop)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ring-glow)}50%{box-shadow:0 0 0 3px #fff,0 0 0 12px rgba(0,137,195,.08)}}
.panel{display:flex;flex-direction:column;gap:14px}
.step-k{font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-size:1rem}
.panel h3{font-size:clamp(1.7rem,2.6vw,2.3rem)}
.panel .txt{display:grid;gap:10px}
.panel .txt p{color:var(--ink)}
.panel .txt em{color:var(--ink-2)}
.tip{background:var(--tip-bg);border-radius:10px;padding:11px 14px;font-size:.95rem}
.tip.warn{background:var(--bad-bg)}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand);background:transparent;padding:0}
.dot[aria-current="step"]{background:var(--brand)}
.dot.done{background:var(--brand-2);border-color:var(--brand-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mini{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.mini th,.mini td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.mini tr.pick td{background:var(--surface-2);font-weight:600}
.mini-wrap{overflow-x:auto}
.cap{font-size:.82rem;color:var(--ink-2);margin-top:8px;text-align:center}

/* quiz */
.quiz{max-width:860px}
.q-h{font-size:clamp(1.6rem,3vw,2.2rem)}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.opt b{font-family:var(--f-display);font-size:1.3rem;color:var(--brand)}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.no{background:var(--bad-bg);border-color:var(--stop)}
.fb{padding:12px 16px;border-radius:12px;background:var(--surface-2)}
.score{font-family:var(--f-display);font-size:4.5rem;font-weight:700;color:var(--brand);line-height:1}

/* resumo e folha */
.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.recap .card h3{font-size:1.45rem;margin-bottom:6px}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sheet .card h3{font-size:1.5rem;color:var(--deep);margin-bottom:8px;border-bottom:2px solid var(--brand-2);padding-bottom:6px}
.sheet ol{margin:0;padding-left:1.25rem;display:grid;gap:5px;font-size:.98rem}
.sheet .note{margin-top:8px;font-size:.92rem;color:var(--ink-2)}

/* rodapé */
.foot{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;flex-wrap:wrap}
.bar{flex:1;min-width:120px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));width:0;transition:width .25s}
.nav{background:var(--surface-2);border:0;border-radius:10px;padding:9px 16px;font-weight:600;color:var(--deep)}
.nav:hover:not([disabled]){filter:brightness(.96)}
.nav[disabled]{opacity:.4;cursor:default}
.nav.pri{background:var(--brand);color:var(--on-brand)}
.nav.on{background:var(--brand-2);color:#06202D}
.notes{border-top:1px dashed var(--line);background:var(--surface-2);max-height:38dvh;overflow:auto}
.notes-in{max-width:1320px;margin:0 auto;padding-block:14px}
.notes h4{margin:0 0 6px;font-family:var(--f-display);font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;color:var(--deep)}
.notes p{max-width:100ch}

@media (max-width:980px){
  .cover,.two,.recap,.sheet{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:minmax(0,1fr)}
  .node{min-height:0}
  .walk{grid-template-columns:minmax(0,1fr)}
  .shot-wrap img{max-height:none}
  .brand-panel{aspect-ratio:auto;max-height:none}
  .cover{min-height:0}
}
@media (max-width:560px){
  body{font-size:16px}
  .ag{grid-template-columns:40px minmax(0,1fr)}
  .ag .min{grid-column:2;justify-self:start}
  .top-title{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.hs{animation:none}.bar>div{transition:none}}
</style>

const $=s=>document.querySelector(s);
const stage=$("#stage");
let cur=0, step=0, flowSel=0;
const stepsOf=i=>SLIDES[i].type==="walk"?SLIDES[i].steps.length:1;
const idxById=id=>SLIDES.findIndex(s=>s.id===id);

function hsHTML(h){
  const cls="hs"+(h.stop?" stop":"")+(h.low?" low":"")+(h.r?" r":"");
  return `<div class="${cls}" style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%">${h.l?`<i>${h.l}</i>`:""}</div>`;
}
function renderWalkStep(){
  const S=SLIDES[cur], st=S.steps[step];
  $("#shotw").innerHTML=`<img alt="Tela do Omie: ${st.t}" src="${IMG[st.img]}">`+st.hs.map(hsHTML).join("");
  $("#stepk").textContent=`Passo ${step+1} de ${S.steps.length}`;
  $("#steph").textContent=st.t;
  $("#stepb").innerHTML=st.b.map(x=>`<p>${x}</p>`).join("")+(st.tip?`<div class="tip${st.warn?" warn":""}">${st.tip}</div>`:"");
  $("#dots").innerHTML=S.steps.map((_,i)=>`<button class="dot${i<step?" done":""}" ${i===step?'aria-current="step"':""} data-s="${i}" aria-label="Ir para o passo ${i+1}"></button>`).join("");
  $("#dots").querySelectorAll(".dot").forEach(d=>d.onclick=()=>go(cur,+d.dataset.s));
  $("#sp").disabled=(cur===0&&step===0);
  $("#sn").textContent=(step===S.steps.length-1)?"Próximo slide →":"Próximo passo →";
  $("#sp").onclick=()=>move(-1); $("#sn").onclick=()=>move(1);
}

function bind(S){
  if(S.type==="cover") $("#start").onclick=()=>move(1);
  if(S.type==="agenda") stage.querySelectorAll(".ag").forEach(b=>b.onclick=()=>go(idxById(b.dataset.to),0));
  if(S.type==="flow"){
    const show=()=>{const f=FLOW[flowSel];$("#fd").innerHTML=`<h3>${f.t}</h3><p>${f.d}</p>`;
      stage.querySelectorAll(".node").forEach(n=>n.setAttribute("aria-pressed",String(+n.dataset.i===flowSel)));};
    stage.querySelectorAll(".node").forEach(n=>n.onclick=()=>{flowSel=+n.dataset.i;show();}); show();
  }
  if(S.type==="walk") renderWalkStep();
  if(S.type==="quiz") quizInit();
  if(S.type==="sheet") $("#copy").onclick=copySheet;
}

/* quiz */
let qi=0,score=0,answered=false;
function quizInit(){qi=0;score=0;answered=false;quizShow();}
function quizShow(){
  const box=$("#qbox");
  if(qi>=QUIZ.length){
    box.innerHTML=`<div class="card" style="display:grid;gap:10px"><div class="score">${score} / ${QUIZ.length}</div><p class="lead">${score===QUIZ.length?"Todas certas. A turma está pronta para cotar.":score>=3?"Bom resultado. Revise os pontos que geraram dúvida na folha de consulta.":"Vale rever os passos antes de cotar. Use o resumo e a folha de consulta."}</p><div class="row"><button class="btn ghost" id="qre">Refazer o quiz</button></div></div>`;
    $("#qre").onclick=quizInit; return;
  }
  const Q=QUIZ[qi]; answered=false;
  box.innerHTML=`<div class="card" style="display:grid;gap:14px"><div class="step-k">Pergunta ${qi+1} de ${QUIZ.length}</div><h3 class="q-h">${Q.q}</h3>
   <div class="opts">${Q.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${"ABCD"[i]}</b><span>${o}</span></button>`).join("")}</div><div id="fb"></div></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(answered) return; answered=true; const i=+b.dataset.i; if(i===Q.c) score++;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true; const k=+x.dataset.i; if(k===Q.c) x.classList.add("ok"); else if(k===i) x.classList.add("no");});
    $("#fb").innerHTML=`<div class="fb"><b>${i===Q.c?"Certo.":"Não foi essa."}</b> ${Q.e}</div><div class="row" style="margin-top:12px"><button class="btn" id="qn">${qi===QUIZ.length-1?"Ver resultado":"Próxima pergunta"}</button></div>`;
    $("#qn").onclick=()=>{qi++;quizShow();};
  });
}

/* copiar folha */
function sheetText(){
  const strip=h=>h.replace(/<[^>]+>/g,"");
  return "FOLHA DE CONSULTA RÁPIDA · Frete dos Correios no Omie\n\n"+SHEET.map(s=>s.t.toUpperCase()+"\n"+(s.n&&s.t==="Deu erro de embalagem?"?strip(s.n)+"\n":"")+s.l.map((x,i)=>`${i+1}. ${strip(x)}`).join("\n")+(s.n&&s.t!=="Deu erro de embalagem?"?"\n"+strip(s.n):"")).join("\n\n");
}
function copySheet(){
  const t=sheetText(), ok=()=>{$("#copied").textContent="Texto copiado.";};
  const fb=()=>{const r=document.createRange();r.selectNodeContents($("#sheet"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("#copied").textContent="Texto selecionado. Use Ctrl+C.";};
  try{navigator.clipboard.writeText(t).then(ok,fb);}catch(e){fb();}
}

/* navegação */
function draw(){
  const S=SLIDES[cur];
  stage.innerHTML=view(S); bind(S);
  $("#secname").textContent=S.sec+" · Frete dos Correios no Omie";
  $("#count").textContent=`${cur+1} / ${SLIDES.length}`;
  let done=cur+(S.type==="walk"?(step+1)/stepsOf(cur):1);
  $("#barfill").style.width=(done/SLIDES.length*100)+"%";
  $("#prev").disabled=(cur===0); $("#next").disabled=(cur===SLIDES.length-1);
  $("#notes-body").innerHTML=`<h4>Roteiro do apresentador</h4><p>${S.notes}</p>`;
  try{history.replaceState(null,"","#"+S.id+(S.type==="walk"?"-"+(step+1):""));}catch(e){}
  window.scrollTo({top:0});
}
function go(i,s){cur=Math.max(0,Math.min(SLIDES.length-1,i));step=Math.max(0,Math.min(stepsOf(cur)-1,s||0));draw();}
function move(d){
  const S=SLIDES[cur];
  if(S.type==="walk"){
    const n=S.steps.length;
    if(d>0&&step<n-1){step++;partial();return;}
    if(d<0&&step>0){step--;partial();return;}
  }
  if(d>0&&cur<SLIDES.length-1) go(cur+1,0);
  else if(d<0&&cur>0) go(cur-1,stepsOf(cur-1)-1);
}
function partial(){
  renderWalkStep();
  const S=SLIDES[cur];
  $("#barfill").style.width=((cur+(step+1)/S.steps.length)/SLIDES.length*100)+"%";
  try{history.replaceState(null,"","#"+S.id+"-"+(step+1));}catch(e){}
}
$("#prev").onclick=()=>move(-1); $("#next").onclick=()=>move(1);
$("#btn-notes").onclick=()=>{const n=$("#notes");n.hidden=!n.hidden;$("#btn-notes").classList.toggle("on",!n.hidden);$("#btn-notes").setAttribute("aria-pressed",String(!n.hidden));};
$("#btn-full").onclick=toggleFull;
function toggleFull(){try{if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tag=(e.target.tagName||"").toLowerCase(), onBtn=tag==="button";
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();move(1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();move(-1);}
  else if(e.key===" "&&!onBtn){e.preventDefault();move(1);}
  else if(e.key==="Home"){go(0,0);} else if(e.key==="End"){go(SLIDES.length-1,0);}
  else if(e.key==="n"||e.key==="N"){$("#btn-notes").click();}
  else if(e.key==="f"||e.key==="F"){toggleFull();}
});
(function init(){
  const h=(location.hash||"").slice(1), m=h.match(/^([a-z]+)(?:-(\d+))?$/);
  if(m){const i=idxById(m[1]); if(i>=0){go(i,m[2]?+m[2]-1:0);return;}}
  go(0,0);
})();
addEventListener("hashchange",()=>{const m=(location.hash||"").slice(1).match(/^([a-z]+)(?:-(\d+))?$/);if(m){const i=idxById(m[1]);if(i>=0&&(i!==cur||(m[2]&&+m[2]-1!==step)))go(i,m[2]?+m[2]-1:0);}});
</script>
